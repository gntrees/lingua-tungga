name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # `tee` keeps a readable log for the annotation step without hiding the
    # exit status.
    shell: bash

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: set -o pipefail; cargo fmt --all --check 2>&1 | tee fmt.log
      - name: clippy
        run: set -o pipefail; cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
      - name: test
        run: set -o pipefail; cargo test --workspace 2>&1 | tee test.log
      - name: annotate failure
        if: failure()
        run: |
          lines="$(grep -ahE 'error(\[E[0-9]+\])?:|panicked at|FAILED|test result: FAILED|No such file' *.log 2>/dev/null | tail -10)"
          if [ -z "$lines" ]; then lines="$(tail -10 *.log 2>/dev/null)"; fi
          printf '%s\n' "$lines" | sed 's/^/::error::/' || true
          exit 0

  conformance:
    name: conformance (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ts, py, go]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: conformance-${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: run conformance suite
        run: |
          set -o pipefail
          script="scripts/conformance-${{ matrix.target }}.sh"
          if [ "${{ matrix.target }}" = "ts" ]; then script="scripts/conformance.sh"; fi
          bash "$script" 2>&1 | tee conformance.log
      - name: annotate failure
        if: failure()
        run: |
          lines="$(grep -ahE 'error(\[E[0-9]+\])?:|panicked at|FAILED|test result: FAILED|No such file' *.log 2>/dev/null | tail -10)"
          if [ -z "$lines" ]; then lines="$(tail -10 *.log 2>/dev/null)"; fi
          printf '%s\n' "$lines" | sed 's/^/::error::/' || true
          exit 0

  playground:
    name: playground evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: playground
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      # The gate is the run itself: every case is compiled and executed on all
      # three targets. evidence.json carries a timestamp and toolchain versions,
      # so diffing it would fail on every run.
      - name: run playground suite
        run: set -o pipefail; bash scripts/playground.sh 2>&1 | tee playground.log
      - name: annotate failure
        if: failure()
        run: |
          lines="$(grep -ahE 'error(\[E[0-9]+\])?:|panicked at|FAILED|test result: FAILED|No such file' *.log 2>/dev/null | tail -10)"
          if [ -z "$lines" ]; then lines="$(tail -10 *.log 2>/dev/null)"; fi
          printf '%s\n' "$lines" | sed 's/^/::error::/' || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground
          path: out/playground/index.html
