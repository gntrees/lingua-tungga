name: nightly

# The playground verifies every documented language rule on all three targets,
# plus the three conformance suites: minutes of work that does not belong on
# every push. Run it by hand with:
#   ./scripts/playground.sh
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: playground
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: run playground suite
        run: set -o pipefail; bash scripts/playground.sh 2>&1 | tee playground.log
      - name: annotate failure
        if: failure()
        run: |
          lines="$(grep -ahE 'error|FAILED|failed|Expected|Received' playground.log 2>/dev/null | tail -10)"
          if [ -z "$lines" ]; then lines="$(tail -10 playground.log 2>/dev/null)"; fi
          printf '%s\n' "$lines" | sed 's/^/::error::/' || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground
          path: out/playground/index.html
