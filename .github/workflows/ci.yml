name: ci

# Per-push work stays small. The heavy checks live elsewhere:
#   - playground: .github/workflows/nightly.yml
#   - macOS/Windows and the full target matrix: pushes to main only
#   - everything at once, locally: ./scripts/check.sh --full
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "dist/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "dist/**"

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  # One compiler build shared by every conformance target, instead of three
  # independent `cargo run` compilations.
  build-lt:
    name: build lt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin lt
      - uses: actions/upload-artifact@v4
        with:
          name: lt-bin
          path: target/release/lt
          retention-days: 3

  rust:
    name: rust (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: set -o pipefail; cargo fmt --all --check 2>&1 | tee fmt.log
      - name: clippy
        run: set -o pipefail; cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
      - name: test
        run: set -o pipefail; cargo test --workspace 2>&1 | tee test.log
      - name: annotate failure
        if: failure()
        run: |
          lines="$(grep -ahE 'error(\[E[0-9]+\])?:|panicked at|FAILED|test result: FAILED|No such file' *.log 2>/dev/null | tail -10)"
          if [ -z "$lines" ]; then lines="$(tail -10 *.log 2>/dev/null)"; fi
          printf '%s\n' "$lines" | sed 's/^/::error::/' || true
          exit 0

  rust-platforms:
    name: rust (${{ matrix.os }})
    # Cross-platform breakage is rare; catch it on main instead of every PR.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: set -o pipefail; cargo test --workspace 2>&1 | tee test.log
      - name: annotate failure
        if: failure()
        run: |
          lines="$(grep -ahE 'error(\[E[0-9]+\])?:|panicked at|FAILED|test result: FAILED' test.log 2>/dev/null | tail -10)"
          if [ -z "$lines" ]; then lines="$(tail -10 test.log 2>/dev/null)"; fi
          printf '%s\n' "$lines" | sed 's/^/::error::/' || true
          exit 0

  conformance:
    name: conformance (${{ matrix.target }})
    needs: build-lt
    # PRs get the TypeScript target only; the full matrix runs on main.
    if: matrix.target == 'ts' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ts, py, go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lt-bin
          path: lt-bin
      - run: chmod +x lt-bin/lt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: run conformance suite
        env:
          LT_BIN: ${{ github.workspace }}/lt-bin/lt
        run: |
          set -o pipefail
          script="scripts/conformance-${{ matrix.target }}.sh"
          if [ "${{ matrix.target }}" = "ts" ]; then script="scripts/conformance.sh"; fi
          bash "$script" 2>&1 | tee conformance.log
      - name: annotate failure
        if: failure()
        run: |
          lines="$(grep -ahE 'error(\[E[0-9]+\])?:|panicked at|FAILED|test result: FAILED|No such file' conformance.log 2>/dev/null | tail -10)"
          if [ -z "$lines" ]; then lines="$(tail -10 conformance.log 2>/dev/null)"; fi
          printf '%s\n' "$lines" | sed 's/^/::error::/' || true
          exit 0
